name: Set up Filoquent tests
description: Install PHP and resolve the selected Composer dependency lane
inputs:
  php-version:
    description: PHP version to install
    required: true
  stability:
    description: Composer dependency preference
    required: true
  extensions:
    description: PHP database and cache extensions for the job
    default: pdo_sqlite
runs:
  using: composite
  steps:
    - name: Set up CI dependencies
      uses: artisan-toolbox/maintainer@c46eefa9d82cdfcd53c83c06c810ca2d3b0c7c33 # 1.14.4
      with:
        php-version: ${{ inputs.php-version }}
        php-extensions: dom, curl, libxml, mbstring, zip, fileinfo, bcmath, intl, ${{ inputs.extensions }}
        composer-mode: ${{ inputs.stability }}
        composer-validation: no-check-lock
        composer-scripts: 'false'

    - name: Discover Testbench packages
      shell: bash
      run: composer run prepare
