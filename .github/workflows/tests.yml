name: tests

on:
  push:
    branches:
      - '*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        stability: [prefer-lowest, prefer-stable]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: windows-latest
            runner: windows-2025

    name: SQLite - P8.5 - L13.* - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        if: runner.os == 'Linux' && matrix.stability == 'prefer-stable'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check shared agent standards
        if: runner.os == 'Linux' && matrix.stability == 'prefer-stable'
        run: node .ai/sync.mjs --check

      - uses: ./.github/actions/setup
        with:
          stability: ${{ matrix.stability }}

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Rector
        run: composer refactor:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        run: composer test:types

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: php vendor/bin/pest

  redis-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stability: [prefer-lowest, prefer-stable]
    name: SQLite Redis journal - P8.5 - L13 - ${{ matrix.stability }}
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          stability: ${{ matrix.stability }}
          extensions: pdo_sqlite, redis

      - name: Test Redis journal integration
        env:
          FILOQUENT_TEST_REDIS_HOST: 127.0.0.1
          FILOQUENT_TEST_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: php vendor/bin/pest --group=redis

  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stability: [prefer-lowest, prefer-stable]
    name: MySQL - P8.5 - L13 - ${{ matrix.stability }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: filoquent_test
          MYSQL_DATABASE: filoquent_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping --silent --host=127.0.0.1 --protocol=tcp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          stability: ${{ matrix.stability }}
          extensions: pdo_sqlite, pdo_mysql, redis

      - name: PHPStan
        run: composer analyse

      - name: Type Coverage
        run: composer test:types

      - name: Test Suite
        env:
          FILOQUENT_TEST_REDIS_HOST: 127.0.0.1
          FILOQUENT_TEST_DATABASE_DRIVER: mysql
          FILOQUENT_TEST_MYSQL_HOST: 127.0.0.1
          FILOQUENT_TEST_MYSQL_DATABASE: filoquent_test
          FILOQUENT_TEST_MYSQL_USERNAME: root
          FILOQUENT_TEST_MYSQL_PASSWORD: filoquent_test
          FILOQUENT_TEST_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          FILOQUENT_TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: composer test:unit -- --processes=2

  pgsql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stability: [prefer-lowest, prefer-stable]
    name: PostgreSQL - P8.5 - L13 - ${{ matrix.stability }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: filoquent
          POSTGRES_PASSWORD: filoquent
          POSTGRES_DB: filoquent_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U filoquent -d filoquent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          stability: ${{ matrix.stability }}
          extensions: pdo_sqlite, pdo_pgsql, redis

      - name: PHPStan
        run: composer analyse

      - name: Type Coverage
        run: composer test:types

      - name: Test Suite
        env:
          FILOQUENT_TEST_REDIS_HOST: 127.0.0.1
          FILOQUENT_TEST_DATABASE_DRIVER: pgsql
          FILOQUENT_TEST_PGSQL_HOST: 127.0.0.1
          FILOQUENT_TEST_PGSQL_DATABASE: filoquent_test
          FILOQUENT_TEST_PGSQL_USERNAME: filoquent
          FILOQUENT_TEST_PGSQL_PASSWORD: filoquent
          FILOQUENT_TEST_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          FILOQUENT_TEST_PGSQL_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: composer test:unit -- --processes=2
